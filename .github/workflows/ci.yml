name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SRIC_CORE_CI_REF: ccfef33dc2cb45f9050b17435d65b367eb1daaea
  REPROSEC_CI_REF: d3af3d00e65c872d988a8e46a522cf503de391f9

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./sric-core
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pytest ruff mypy build pip-audit hypothesis httpx
      - run: python -m sric.standalone_gate --root .
      - run: python scripts/release-gate.py --quick

  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux install/uninstall preservation smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          SRIC_CORE_SOURCE: ${{ github.workspace }}/sric-core
        run: |
          TEST_HOME="${RUNNER_TEMP}/authtwin-home"
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" sh scripts/install-linux.sh
          "$TEST_HOME/.authtwin/venv/bin/authtwin" init preserve
          HOME="$TEST_HOME" sh scripts/uninstall-linux.sh
          test -f "$TEST_HOME/.authtwin/workspaces/preserve/workspace.json"
      - name: Windows install/uninstall preservation smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'authtwin-home'
          $env:SRIC_CORE_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'sric-core'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          cmd /c scripts\install-windows.cmd
          $runtime = "$env:USERPROFILE\.authtwin\venv\Scripts\authtwin.exe"
          & $runtime version
          & $runtime doctor --json
          & $runtime capabilities
          & $runtime init preserve
          cmd /c scripts\uninstall-windows.cmd
          if (Test-Path "$env:USERPROFILE\.authtwin\venv") { throw 'runtime venv was not removed' }
          if (-not (Test-Path "$env:USERPROFILE\.authtwin\workspaces\preserve\workspace.json")) { throw 'workspace data was removed' }

  rcap-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/reprosec
          ref: ${{ env.REPROSEC_CI_REF }}
          path: reprosec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ./sric-core
      - run: python -m pip install -e ./reprosec
      - run: python -m pip install -e .
      - run: authtwin capabilities
